# Additive qualification pins. Keep this overlay in the tested release configuration.
# Ports are loopback-only and must be unused; this never reuses an application volume.
services:
  database:
    image: ${QUALIFICATION_DATABASE_IMAGE:-postgres:17.11@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3}
  cache:
    image: ${QUALIFICATION_CACHE_IMAGE:-redis:8.10.3-alpine3.23@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80}
  gateway:
    image: ${QUALIFICATION_GATEWAY_IMAGE:-nginx:1.30.6-alpine3.24@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311}
    ports: !override
      - "127.0.0.1:${QUALIFICATION_TLS_PORT:-8452}:8443"
      - "127.0.0.1:${QUALIFICATION_HTTP_PORT:-8092}:8080"
    volumes:
      - "${QUALIFICATION_GATEWAY_CONFIG:?Supply the isolated gateway configuration}:/etc/nginx/nginx.conf:ro"
