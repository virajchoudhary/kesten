pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    log_format safe_json escape=json '{"event":"gateway_request","request_id":"$request_id","method":"$request_method","status":$status,"duration_seconds":$request_time}';
    access_log /dev/stdout safe_json;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=connections:10m rate=20r/s;
    upstream api { server api:8000; }
    upstream web { server web:3000; }
    server {
        listen 8080;
        return 308 https://$host:8443$request_uri;
    }
    server {
        listen 8443 ssl;
        ssl_certificate /run/secrets/gateway_cert;
        ssl_certificate_key /run/secrets/gateway_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        client_max_body_size 2m;
        limit_req zone=connections burst=40 nodelay;
        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Cadrisyn-Client-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
        location /health/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
        }
    }
}
