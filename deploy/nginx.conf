events {}
http {
    log_format safe_json escape=json '{"event":"gateway_request","request_id":"$request_id","method":"$request_method","status":$status,"duration_seconds":$request_time}';
    access_log /dev/stdout safe_json;
    server_tokens off;
    upstream api { server api:8000; }
    upstream web { server web:3000; }
    server {
        listen 8080;
        client_max_body_size 2m;
        location /static/ { alias /static/; }
        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Cadrisyn-Client-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
        location /health/ { proxy_pass http://api; proxy_set_header Host $host; }
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }
    }
}
