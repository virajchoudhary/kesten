services:
  database:
    image: postgres:17.11
    environment:
      POSTGRES_DB: cadrisyn
      POSTGRES_USER: cadrisyn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadrisyn"]
      interval: 5s
      timeout: 3s
      retries: 10
  cache:
    image: redis:8.0.6
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DATABASE_URL: postgresql://cadrisyn:${POSTGRES_PASSWORD}@database:5432/cadrisyn
      DJANGO_CACHE_URL: redis://cache:6379/0
      DJANGO_SECURE_SSL_REDIRECT: "false"
      CADRISYN_LEGACY_ENABLED: "false"
      CADRISYN_MARKET_DATA_ENABLED: "false"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      DJANGO_API_URL: http://api:8000
    depends_on: [api]
  gateway:
    image: nginx:1.28.3-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: [web, api]
volumes:
  database:
