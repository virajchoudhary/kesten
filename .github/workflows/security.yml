name: Security scanning

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-runtime-audit:
    name: Audit Python runtime dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned pip-audit
        run: |
          python -m venv .security-venv
          .security-venv/bin/python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
      - name: Audit API runtime requirements
        run: .security-venv/bin/python -m pip_audit -r backend/requirements-runtime.txt

  python-workspace-audit:
    name: Audit Python workspace dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned pip-audit
        run: |
          python -m venv .security-venv
          .security-venv/bin/python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
      - name: Audit workspace lock
        run: .security-venv/bin/python -m pip_audit -r backend/requirements-workspace.lock.txt

  npm-production-audit:
    name: Audit web production dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22.23.4
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Audit web production dependencies
        run: npm audit --omit=dev
        working-directory: web

  app-image-scan:
    name: Scan ${{ matrix.app }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: backend/Dockerfile
          - app: web
            dockerfile: web/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: |
          mkdir -p security-reports
          docker build --pull --provenance=mode=max --metadata-file security-reports/build.json --build-arg CADRISYN_SOURCE_REVISION="$GITHUB_SHA" --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" --file ${{ matrix.dockerfile }} --tag cadrisyn-${{ matrix.app }}:security .
          docker image inspect cadrisyn-${{ matrix.app }}:security > security-reports/image.json
      - name: Inventory final image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: cadrisyn-${{ matrix.app }}:security
          syft-version: v1.57.0
          format: spdx-json
          output-file: security-reports/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Scan image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: cadrisyn-${{ matrix.app }}:security
          grype-version: v0.121.2
          severity-cutoff: medium
          fail-build: true
          output-format: json
          output-file: security-reports/vulnerabilities.json
      - name: Retain image evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-evidence-${{ matrix.app }}-${{ github.sha }}
          path: security-reports/
          retention-days: 7
          if-no-files-found: error
