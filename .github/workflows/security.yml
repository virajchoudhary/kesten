name: Security scanning

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned pip-audit
        run: |
          python -m venv .security-venv
          .security-venv/bin/python -m pip install --disable-pip-version-check "pip-audit==2.10.1"

      - name: Audit API runtime requirements
        run: .security-venv/bin/python -m pip_audit -r backend/requirements-runtime.txt

      - name: Audit workspace dependency lock
        run: .security-venv/bin/python -m pip_audit -r backend/requirements-workspace.lock.txt

      - name: Set up Node.js 22.23.4
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"

      - name: Audit web production dependencies
        run: npm audit --omit=dev
        working-directory: web

  app-image-scan:
    name: Scan ${{ matrix.app }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: backend/Dockerfile
          - app: web
            dockerfile: web/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --pull --file ${{ matrix.dockerfile }} --tag cadrisyn-${{ matrix.app }}:security .

      - name: Scan image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: cadrisyn-${{ matrix.app }}:security
          grype-version: v0.121.2
          severity-cutoff: medium
          fail-build: true
          output-format: table
