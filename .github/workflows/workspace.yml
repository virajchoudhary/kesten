name: Cadrisyn workspace

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-workspace.lock.txt
      - name: Install workspace dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r backend/requirements-workspace.lock.txt
      - name: Check Django, migrations, deployment settings, and API contract
        run: .venv/bin/python scripts/check_backend.py
      - name: Run backend unit and recovery-client checks
        run: |
          .venv/bin/python -m unittest discover -s tests -p test_research_client.py
          .venv/bin/python -m unittest discover -s tests -p test_dev_environment.py
          .venv/bin/python -m unittest discover -s tests -p test_workspace_migration.py
          .venv/bin/python -m unittest discover -s tests -p test_release_gate.py
          .venv/bin/python -m unittest discover -s tests -p test_release_preflight.py

  numerical:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-workspace.lock.txt
      - name: Install workspace dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r backend/requirements-workspace.lock.txt
      - name: Run offline quantitative regression suite
        run: .venv/bin/python backend/manage.py test research.tests.test_quant --noinput
        env:
          DJANGO_SETTINGS_MODULE: quantvision.settings
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ci-numerical-only-no-production-data
          CADRISYN_DB_PATH: .local/numerical-unused.sqlite3

  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-workspace.lock.txt
      - name: Install workspace dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r backend/requirements-workspace.lock.txt
      - name: Run isolated backup and restore tests
        run: .venv/bin/python -m unittest discover -s tests -p test_recovery.py

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22.23.4
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Verify generated API types
        run: npm run typegen && git diff --exit-code -- src/lib/api/generated.ts
        working-directory: web
      - name: Build and test frontend
        run: npm run build && npm run typecheck && npm run lint && npm test
        working-directory: web

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-workspace.lock.txt
      - name: Set up Node.js 22.23.4
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install workspace dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r backend/requirements-workspace.lock.txt
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Run browser acceptance
        env:
          PLAYWRIGHT_PRODUCTION: "1"
        run: |
          .venv/bin/python scripts/prepare_browser_fixture.py
          .venv/bin/python scripts/dev.py --api-only > /tmp/cadrisyn-api.log 2>&1 &
          cd web
          npm run test:e2e

  postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      database:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-bootstrap-only
          CADRISYN_DB_PASSWORD: ci-app-only
          CADRISYN_MIGRATION_PASSWORD: ci-migration-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      cache:
        image: redis:8.0.6
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: quantvision.settings
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-fixture-key-with-no-production-or-user-data-000000000000
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgresql://cadrisyn:ci-app-only@127.0.0.1:5432/cadrisyn
      DJANGO_CACHE_URL: redis://127.0.0.1:6379/1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-workspace.lock.txt
      - name: Install workspace dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r backend/requirements-workspace.lock.txt
      - name: Create restricted role and disposable databases
        run: |
          docker exec --interactive "${{ job.services.database.id }}" sh < deploy/postgres-init.sh
          .venv/bin/python -c "import psycopg; db = psycopg.connect('postgresql://postgres:ci-bootstrap-only@127.0.0.1:5432/postgres', autocommit=True); db.execute('CREATE DATABASE test_cadrisyn OWNER cadrisyn_migrator'); db.close()"
      - name: Run migrations and PostgreSQL-backed application tests
        run: |
          DATABASE_URL=postgresql://cadrisyn_migrator:ci-migration-only@127.0.0.1:5432/cadrisyn .venv/bin/python backend/manage.py migrate --noinput
          DATABASE_URL=postgresql://cadrisyn_migrator:ci-migration-only@127.0.0.1:5432/test_cadrisyn .venv/bin/python backend/manage.py migrate --noinput
          .venv/bin/python -c "import psycopg; db = psycopg.connect('postgresql://postgres:ci-bootstrap-only@127.0.0.1:5432/test_cadrisyn'); db.execute('GRANT SELECT, INSERT, UPDATE, DELETE, TRUNCATE ON ALL TABLES IN SCHEMA public TO cadrisyn'); db.execute('GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO cadrisyn'); db.commit(); db.close()"
          .venv/bin/python backend/manage.py makemigrations --check --dry-run
          .venv/bin/python backend/manage.py test accounts workspace research api.test_security --keepdb --noinput

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and probe isolated container stack
        run: |
          mkdir -p .local
          printf 'DJANGO_SECRET_KEY=%s\nPOSTGRES_PASSWORD=%s\nPOSTGRES_ADMIN_PASSWORD=%s\nPOSTGRES_MIGRATION_PASSWORD=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" > .local/ci-preview.env
          docker compose --project-name cadrisyn-ci --env-file .local/ci-preview.env up --build --detach --wait --wait-timeout 360
          curl --fail http://127.0.0.1:8080/health/ready/
          curl --fail http://127.0.0.1:8080/sign-in/
      - name: Qualify isolated non-debug demo transport
        run: |
          python scripts/ops/prepare_local_tls.py --directory .local/ci-tls --api-image "$(docker image inspect cadrisyn-ci-api --format '{{.Id}}')" --web-image "$(docker image inspect cadrisyn-ci-web --format '{{.Id}}')"
          docker compose --project-name cadrisyn-ci-prod --env-file .local/ci-tls/rehearsal.env -f deploy/compose.production.yaml up --detach --wait --wait-timeout 240
          docker compose --project-name cadrisyn-ci-prod --env-file .local/ci-tls/rehearsal.env -f deploy/compose.production.yaml exec -T api python /app/scripts/ops/preflight.py --environment
          curl --fail --cacert .local/ci-tls/tls_ca https://localhost:8443/health/ready/
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --cacert .local/ci-tls/tls_ca https://localhost:8443/api/v1/research/datasets/)" = 404
          curl --fail --cacert .local/ci-tls/tls_ca https://localhost:8443/app/research/ | python -c 'import sys; assert "Demo-only workspace" in sys.stdin.read()'
      - name: Verify upgrade from the legacy PostgreSQL bootstrap role
        run: python scripts/verify_role_upgrade.py --name cadrisyn-ci-role-upgrade --env-file .local/ci-preview.env
      - name: Container diagnostics
        if: failure()
        run: docker compose --project-name cadrisyn-ci --env-file .local/ci-preview.env logs --tail 100
      - name: Stop CI containers
        if: always()
        run: |
          if test -f .local/ci-tls/rehearsal.env; then docker compose --project-name cadrisyn-ci-prod --env-file .local/ci-tls/rehearsal.env -f deploy/compose.production.yaml stop; fi
          docker compose --project-name cadrisyn-ci --env-file .local/ci-preview.env stop
          if docker container inspect cadrisyn-ci-role-upgrade > /dev/null 2>&1; then docker stop cadrisyn-ci-role-upgrade; fi
