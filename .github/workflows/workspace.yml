name: Kerquant workspace

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-workspace.lock.txt
      - name: Install workspace dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r backend/requirements-workspace.lock.txt
      - name: Check Django, migrations, deployment settings, and API contract
        run: .venv/bin/python scripts/check_backend.py
      - name: Run backend unit and recovery-client checks
        run: |
          .venv/bin/python -m unittest discover -s tests -p test_research_client.py
          .venv/bin/python -m unittest discover -s tests -p test_dev_environment.py
          .venv/bin/python -m unittest discover -s tests -p test_workspace_migration.py
          .venv/bin/python -m unittest discover -s tests -p test_release_gate.py
          .venv/bin/python -m unittest discover -s tests -p test_release_preflight.py
          .venv/bin/python -m unittest discover -s tests -p test_portfolio_demo.py
          .venv/bin/python -m unittest discover -s tests -p test_ci_postgresql.py

  numerical:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-workspace.lock.txt
      - name: Install workspace dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r backend/requirements-workspace.lock.txt
      - name: Run offline quantitative regression suite
        run: .venv/bin/python backend/manage.py test research.tests.test_quant --noinput
        env:
          DJANGO_SETTINGS_MODULE: quantvision.settings
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: ci-numerical-only-no-production-data
          CADRISYN_DB_PATH: .local/numerical-unused.sqlite3

  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-workspace.lock.txt
      - name: Install workspace dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r backend/requirements-workspace.lock.txt
      - name: Run isolated backup and restore tests
        run: .venv/bin/python -m unittest discover -s tests -p test_recovery.py

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22.23.4
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Verify generated API types
        run: npm run typegen && git diff --exit-code -- src/lib/api/generated.ts
        working-directory: web
      - name: Build and test frontend
        run: npm run build && npm run typecheck && npm run lint && npm test
        working-directory: web

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-workspace.lock.txt
      - name: Set up Node.js 22.23.4
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install workspace dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r backend/requirements-workspace.lock.txt
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Build browser acceptance frontend
        run: npm run build
        working-directory: web
        env:
          CADRISYN_WEB_RELEASE_PROFILE: development
          DJANGO_API_URL: http://127.0.0.1:8000
      - name: Run disposable browser acceptance
        env:
          PLAYWRIGHT_PRODUCTION: "1"
          CADRISYN_WEB_RELEASE_PROFILE: development
          DJANGO_API_URL: http://127.0.0.1:8000
        run: |
          .venv/bin/python scripts/demo.py --directory .local/ci-browser --prepare-only --browser-fixtures
          export CADRISYN_E2E_FIXTURE_DIR="$PWD/.local/ci-browser"
          .venv/bin/python scripts/demo.py --directory .local/ci-browser --api-only > /tmp/kerquant-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          cd web
          npm run test:e2e -- --workers=1

  postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      cache:
        image: redis:8.0.6
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: quantvision.settings
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CACHE_URL: redis://127.0.0.1:6379/1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-workspace.lock.txt
      - name: Install workspace dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r backend/requirements-workspace.lock.txt
      - name: Run migrations and tests with fresh PostgreSQL credentials
        run: .venv/bin/python scripts/ci_postgresql.py

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and probe isolated container stack
        run: |
          mkdir -p .local
          printf 'DJANGO_SECRET_KEY=%s\nPOSTGRES_PASSWORD=%s\nPOSTGRES_ADMIN_PASSWORD=%s\nPOSTGRES_MIGRATION_PASSWORD=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" "$(openssl rand -hex 24)" > .local/ci-preview.env
          docker compose --project-name cadrisyn-ci --env-file .local/ci-preview.env up --build --detach --wait --wait-timeout 360
          curl --fail http://127.0.0.1:8080/health/ready/
          curl --fail http://127.0.0.1:8080/sign-in/
      - name: Qualify isolated non-debug demo transport
        run: |
          python scripts/ops/prepare_local_tls.py --directory .local/ci-tls --api-image "$(docker image inspect cadrisyn-ci-api:local --format '{{.Id}}')" --web-image "$(docker image inspect cadrisyn-ci-web:local --format '{{.Id}}')"
          docker compose --project-name cadrisyn-ci-prod --env-file .local/ci-tls/rehearsal.env -f deploy/compose.production.yaml up --detach --wait --wait-timeout 240
          docker compose --project-name cadrisyn-ci-prod --env-file .local/ci-tls/rehearsal.env -f deploy/compose.production.yaml exec -T api python /app/scripts/ops/preflight.py --environment
          curl --fail --cacert .local/ci-tls/tls_ca https://localhost:8443/health/ready/
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --cacert .local/ci-tls/tls_ca https://localhost:8443/api/v1/research/datasets/)" = 404
          curl --fail --cacert .local/ci-tls/tls_ca https://localhost:8443/app/research/ | python -c 'import sys; assert "Demo-only workspace" in sys.stdin.read()'
      - name: Verify upgrade from the legacy PostgreSQL bootstrap role
        run: python scripts/verify_role_upgrade.py --name cadrisyn-ci-role-upgrade --env-file .local/ci-preview.env
      - name: Container diagnostics
        if: failure()
        run: docker compose --project-name cadrisyn-ci --env-file .local/ci-preview.env logs --tail 100
      - name: Stop CI containers
        if: always()
        run: |
          if test -f .local/ci-tls/rehearsal.env; then docker compose --project-name cadrisyn-ci-prod --env-file .local/ci-tls/rehearsal.env -f deploy/compose.production.yaml stop; fi
          docker compose --project-name cadrisyn-ci --env-file .local/ci-preview.env stop
          if docker container inspect cadrisyn-ci-role-upgrade > /dev/null 2>&1; then docker stop cadrisyn-ci-role-upgrade; fi
